name: Descobrir links das lojas

on:
  schedule:
    # Atualiza o catálogo diariamente às 03:23 UTC.
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: descobrir-links-${{ github.ref }}
  cancel-in-progress: false

jobs:
  descobrir:
    name: Descobrir na ${{ matrix.loja }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        loja: [Amazon, KaBuM, Pichau, Terabyte]

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Preparar o Chrome Stable
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends google-chrome-stable
          CHROME_BIN="$(command -v google-chrome-stable)"
          CHROME_VERSION_MAIN="$("$CHROME_BIN" --version | grep -oE '[0-9]+' | head -1)"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "CHROME_VERSION_MAIN=$CHROME_VERSION_MAIN" >> "$GITHUB_ENV"

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Pesquisar produtos
        run: >-
          python descobrir_links.py
          --loja "${{ matrix.loja }}"
          --catalogo "catalogo-${{ matrix.loja }}.json"

      - name: Guardar resultado
        uses: actions/upload-artifact@v4
        with:
          name: catalogo-${{ matrix.loja }}
          path: catalogo-${{ matrix.loja }}.json
          retention-days: 1

  publicar:
    name: Publicar catálogo
    needs: descobrir
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar resultados encontrados
        uses: actions/download-artifact@v4
        with:
          pattern: catalogo-*
          path: catalogos-descobertos
          merge-multiple: true

      - name: Unir resultados ao catálogo anterior
        run: >-
          python mesclar_catalogos.py
          --base catalogo_urls.json
          --entrada catalogos-descobertos
          --saida catalogo_urls.json

      - name: Salvar catálogo no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo_urls.json
          if git diff --cached --quiet; then
            echo "O catálogo não mudou."
            exit 0
          fi
          git commit -m "Atualizar catálogo automático das lojas"
          git pull --rebase
          git push
