name: Monitorar preços

on:
  schedule:
    # Executa a cada 30 minutos, fora do início da hora (UTC).
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Mantém somente uma varredura em execução, mas nunca interrompe a atual.
  # Se outra for disparada, ela aguarda; novos disparos substituem apenas a pendente.
  group: monitorar-precos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Preparar o Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Preparar o Chrome Stable
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends google-chrome-stable
          CHROME_BIN="$(command -v google-chrome-stable)"
          CHROME_VERSION_MAIN="$("$CHROME_BIN" --version | grep -oE '[0-9]+' | head -1)"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "CHROME_VERSION_MAIN=$CHROME_VERSION_MAIN" >> "$GITHUB_ENV"
          echo "Chrome selecionado: $CHROME_BIN (versão $CHROME_VERSION_MAIN)"

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Consultar preços
        env:
          GOOGLE_WEBHOOK_URL: ${{ secrets.GOOGLE_WEBHOOK_URL }}
          PROMOTECH_VIA_CHROME: "true"
        run: python monitor_v2_github.py
