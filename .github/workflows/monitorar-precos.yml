name: Monitorar preços

on:
  schedule:
    # Executa a cada 30 minutos, fora do início da hora (UTC).
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Uma nova execução aguarda a atual terminar; nenhuma varredura é cancelada.
  group: monitorar-precos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitorar:
    name: Consultar ${{ matrix.loja }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        loja: [Amazon, KaBuM, Pichau, Terabyte]

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Preparar o Chrome Stable
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends google-chrome-stable
          CHROME_BIN="$(command -v google-chrome-stable)"
          CHROME_VERSION_MAIN="$("$CHROME_BIN" --version | grep -oE '[0-9]+' | head -1)"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "CHROME_VERSION_MAIN=$CHROME_VERSION_MAIN" >> "$GITHUB_ENV"

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Consultar preços
        env:
          GOOGLE_WEBHOOK_URL: ${{ secrets.GOOGLE_WEBHOOK_URL }}
          LOJA_ALVO: ${{ matrix.loja }}
          CATALOGO_URLS_CAMINHO: catalogo_urls.json
        run: python monitor_v2_github.py
