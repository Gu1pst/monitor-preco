name: Monitorar preços
run-name: Monitorar preços v2026-08-19.11

on:
  schedule:
    # Executa a cada 30 minutos, fora do início da hora (UTC).
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Uma nova execução aguarda a atual terminar; nenhuma varredura é cancelada.
  group: monitorar-precos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitorar:
    name: Consultar ${{ matrix.loja }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        loja: [Amazon, KaBuM, Pichau, Terabyte]

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Preparar o Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Detectar o Chrome do runner
        run: |
          CHROME_BIN=""
          for candidato in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$candidato" >/dev/null 2>&1; then
              CHROME_BIN="$(command -v "$candidato")"
              break
            fi
          done
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome não encontrado na imagem do GitHub Actions."
            exit 1
          fi
          CHROME_VERSION_MAIN="$("$CHROME_BIN" --version | grep -oE '[0-9]+' | head -1)"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "CHROME_VERSION_MAIN=$CHROME_VERSION_MAIN" >> "$GITHUB_ENV"
          echo "Chrome selecionado: $CHROME_BIN (versão $CHROME_VERSION_MAIN)"

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Consultar preços
        env:
          GOOGLE_WEBHOOK_URL: ${{ secrets.GOOGLE_WEBHOOK_URL }}
          LOJA_ALVO: ${{ matrix.loja }}
          CATALOGO_URLS_CAMINHO: catalogo_urls.json
        run: python monitor_v2_github.py
